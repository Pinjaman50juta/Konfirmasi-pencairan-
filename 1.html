<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto - Kredit Cepat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5;display:flex;justify-content:center;padding:16px}
.page{width:100%;max-width:420px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.header{background:#d32f2f;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:14px}
.img-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid #eee}
.img-wrap img{width:100%;display:block}
.btn{width:100%;background:#d32f2f;color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:bold;margin-top:12px;cursor:pointer}
.btn:active{opacity:.8}
.btn-secondary{background:#fff;color:#d32f2f;border:1.5px solid #d32f2f}
.tip{font-size:11px;color:#777;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="page">
  <div class="header">Kredit Cepat - Foto Dokumen</div>
  <div class="card">
    <div style="font-size:13px;font-weight:bold;margin-bottom:8px">Preview Foto</div>
    
    <!-- GANTI SRC DI BAWAH INI DENGAN FOTO KAMU -->
    <div class="img-wrap">
      <img id="foto" src="img/1.png" alt="Foto">
    </div>

    <button class="btn" onclick="downloadFoto()">⬇️ Download Foto</button>
    <button class="btn btn-secondary" onclick="shareFoto()">🔗 Bagikan</button>
    <div class="tip">Foto akan tersimpan di Galeri HP</div>
  </div>
</div>

<script>
const fotoUrl = document.getElementById('foto').src;

async function downloadFoto(){
  try{
    const res = await fetch(fotoUrl);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'foto-kredit-cepat.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    // fallback kalau cross-origin
    window.open(fotoUrl, '_blank');
  }
}

function shareFoto(){
  if(navigator.share){
    navigator.share({title:'Foto', url: fotoUrl});
  }else{
    alert('Link foto: '+fotoUrl);
  }
}
</script>
</body>
</html>
