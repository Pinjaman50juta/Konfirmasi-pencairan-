<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memproses...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;width:90%;max-width:340px}
.logo{width:70px;height:70px;background:#d32f2f;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:30px;margin-bottom:16px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.spinner{width:36px;height:36px;border:3px solid #ffcccc;border-top:3px solid #d32f2f;border-radius:50%;margin:16px auto;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:16px;color:#222;margin-bottom:6px}
p{font-size:13px;color:#777}
.bar{width:100%;height:4px;background:#ffe0e0;border-radius:4px;margin-top:16px;overflow:hidden}
.fill{height:100%;width:0%;background:#d32f2f;animation:load 3s linear forwards}
@keyframes load{to{width:100%}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">✓</div>
  <h2 id="text">Memeriksa data...</h2>
  <p id="sub">Mohon tunggu sebentar</p>
  <div class="spinner"></div>
  <div class="bar"><div class="fill"></div></div>
</div>

<script>
// ==== SETTING DISINI ====
const tujuan = "1.html"; // ganti ke halaman tujuan kamu
const durasiMs = 3000; // 3000 = 3 detik
// ========================

const texts = ["Memeriksa data...", "Verifikasi KTP...", "Menghubungkan ke server..."];
let i = 0;
setInterval(()=>{
  i = (i+1)%texts.length;
  document.getElementById('text').innerText = texts[i];
}, 800);

setTimeout(()=>{
  window.location.href = tujuan;
}, durasiMs);
</script>
</body>
</html>
